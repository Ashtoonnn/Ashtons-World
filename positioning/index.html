<!DOCTYPE html>
<html>
     <head>
        <title>Box Model and Postitioning</title>
        <link rel="stylesheet" href="main.css">
    </head>

     <body>

          <!-- block level elements take up 100% of the browser's width and will stack vertically. -->
          <div class="block">block</div>
          <div class="block">block</div>
          <div class="block">block</div>

          <!-- Inline elements only take up as much space as their content needs, and will nest horizontally alongside one another -->

          <span class="inline">inline</span>
          <span class="inline">inline</span>
          <span class="inline">inline</span>

          <span class="inline-block">inline-block</span>
          <span class="inline-block">inline-block</span>
          <span class="inline-block">inline-block</span>

     <div class= "content-box">content-box</div>
     <div class= "border-box">border-box</div>


     <div class="square sticky">static</div>
     <div class="square relative">relative</div>
     <div class="square">static</div>
     <div class="square fixed">fixed</div>
     <div class="square">static</div>
     <div class="square absolute">absolute</div>
     <div class="square">static</div>
     <div class="square">static</div>
          <!-- NOTES: PLEASE REMEBER TO DELETE WHEN DONE! 

          -Most of the inline elements include  a or b and it's the equivelent to div.
          
          -Unlike the div element. It goes right next to eachother. Rather than stacking like blocks. 
          
          span's needs as much weight as it requires.
          
          10px margin gives the inline in between rather than something like a block level element.-->


     <div class="smiley"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>

          </div>
     </body>
</html>
